[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leghorn"
dynamic = ["version"]
description = "Full-screen live view of every Claude Code session, its git state, and your GitHub CI"
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "George M. Howard", email = "dev@swamplink.com" }]
keywords = ["claude", "claude-code", "tui", "dashboard", "monitoring", "git", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
# No dependencies, and there will not be any: leghorn has to run on whatever
# Python is already on the box, including a bare system 3.9 on macOS.
# (curses is stdlib on macOS and Linux; Windows is not supported.)
dependencies = []

[project.urls]
Homepage = "https://github.com/gmhoward9289-ops/leghorn"
Issues = "https://github.com/gmhoward9289-ops/leghorn/issues"

[project.scripts]
leghorn = "leghorn:main"

# One source of truth for the version: __version__ in leghorn.py, which is also
# what `leghorn --version` prints and what the man page header carries.
[tool.hatch.version]
path = "leghorn.py"

# ccboard.py is the data layer leghorn imports; the two ship together in every
# channel (wheel, deb, brew libexec, npm) because leghorn is only a renderer.
[tool.hatch.build.targets.wheel]
only-include = ["leghorn.py", "ccboard.py"]

[tool.hatch.build.targets.wheel.shared-data]
"leghorn.1" = "share/man/man1/leghorn.1"

[tool.hatch.build.targets.sdist]
include = ["leghorn.py", "ccboard.py", "leghorn.1", "README.md", "LICENSE", "tests/", "packaging/"]
