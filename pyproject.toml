[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "leghorn"
dynamic = ["version"]
description = "Full-screen live view of every Claude Code session, its git state, and your GitHub CI"
readme = "README.md"
requires-python = ">=3.9"
license = { file = "LICENSE" }
authors = [{ name = "George M. Howard", email = "dev@swamplink.com" }]
keywords = ["claude", "claude-code", "tui", "dashboard", "monitoring", "git", "ci"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Environment :: Console :: Curses",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: Apache Software License",
    "Operating System :: MacOS :: MacOS X",
    "Operating System :: POSIX :: Linux",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.13",
    "Topic :: System :: Monitoring",
]
# No dependencies on macOS/Linux, and there will not be any there: leghorn has
# to run on whatever Python is already on the box, including a bare system 3.9
# on macOS. curses is stdlib there but not on Windows at all, so windows-curses
# (a drop-in `curses` backed by PDCurses) is pulled in for that platform only.
# Its wheels currently top out at 3.13 -- a Windows install on a newer
# interpreter will fail to resolve until upstream catches up; that's a
# windows-curses gap, not something pinning requires-python here would fix,
# since it would also needlessly cap macOS/Linux.
dependencies = ["windows-curses; sys_platform == 'win32'"]

[project.urls]
Homepage = "https://github.com/gmhoward9289-ops/leghorn"
Issues = "https://github.com/gmhoward9289-ops/leghorn/issues"

[project.scripts]
leghorn = "leghorn:main"

# One source of truth for the version: __version__ in leghorn.py, which is also
# what `leghorn --version` prints and what the man page header carries.
[tool.hatch.version]
path = "leghorn.py"

# henhouse.py is the data layer leghorn imports; the two ship together in every
# channel (wheel, deb, brew libexec, npm) because leghorn is only a renderer.
[tool.hatch.build.targets.wheel]
only-include = ["leghorn.py", "henhouse.py"]

[tool.hatch.build.targets.wheel.shared-data]
"leghorn.1" = "share/man/man1/leghorn.1"

[tool.hatch.build.targets.sdist]
include = ["leghorn.py", "henhouse.py", "leghorn.1", "README.md", "LICENSE", "tests/", "packaging/"]
