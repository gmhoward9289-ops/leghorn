name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # leghorn claims 3.9+ on macOS, Linux, and Windows. curses is stdlib on
    # the first two; Windows gets it from the windows-curses wheel (declared
    # in pyproject.toml, platform-gated), which is why this job installs it
    # explicitly below rather than relying on the package install step alone.
    # 3.14 is here because it is what the primary dev box actually runs -- every
    # local test run happened on an interpreter CI never exercised. macos-15-intel
    # is here because macos-latest is arm64 now, so Intel Macs were untested.
    # (It replaced macos-13, whose image GitHub retired in Dec 2025 -- jobs
    # asking for it queue forever. macos-15-intel is the designated successor,
    # available until Aug 2027; when it goes, the Intel leg goes with it.)
    #
    # Windows is excluded from 3.14 on purpose: windows-curses wheels top out at
    # 3.13 (see pyproject.toml), so that leg would fail on dependency resolution
    # rather than on anything in this repo -- a red X that teaches nothing. Drop
    # the exclusion once upstream ships a 3.14 wheel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, macos-15-intel, windows-latest]
        python: ["3.9", "3.13", "3.14"]
        exclude:
          - os: windows-latest
            python: "3.14"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
      - name: Install windows-curses
        if: runner.os == 'Windows'
        run: pip install windows-curses
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLIs
        # Everything here must work on a box with no Claude Code, no sessions
        # and no gh auth -- degradation is the contract under test. henhouse
        # renders its table headless; leghorn itself is curses and can only be
        # asked for --version and --help without a tty.
        run: |
          python leghorn.py --version
          python leghorn.py --help
          python henhouse.py --json | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('schema')=='henhouse.session.v1' and 'rows' in d, d"
          python henhouse.py --legacy-json | python -c "import json,sys; d=json.load(sys.stdin); assert isinstance(d, list), type(d)"
          python henhouse.py --github || true
          python henhouse.py --github --json | python -c "import json,sys; d=json.load(sys.stdin); assert set(d) == {'events','warn'}, d"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
      - name: Version consistency across artifacts
        run: packaging/check-version-consistency.sh
      - name: The .deb builds and carries the same version
        run: |
          set -euo pipefail
          packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' leghorn.py)
          test -f "dist/leghorn_${version}_all.deb"
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x "dist/leghorn_${version}_all.deb" /tmp/debx
          got=$(gunzip -c /tmp/debx/usr/share/man/man1/leghorn.1.gz | head -1)
          case "$got" in
            *"\"leghorn ${version}\""*) ;;
            *) echo "::error::man page in the .deb says: $got (want leghorn ${version})"; exit 1 ;;
          esac
          # The /usr/bin entry is a symlink into /usr/lib/leghorn; a broken
          # link here means the sibling-resolution layout regressed.
          test -L /tmp/debx/usr/bin/leghorn
          python3 /tmp/debx/usr/lib/leghorn/leghorn.py --version
          echo "dist/leghorn_${version}_all.deb ok"

      # Every channel must ship henhouse.py beside leghorn.py -- leghorn is
      # only a renderer and cannot start without its data layer. The wheel
      # enforces this via only-include and the .deb via the check above, but
      # npm's file list is hand-maintained and drifted: when coop.py was
      # renamed to henhouse.py the module, the wheel, the deb and the release
      # smoke test were all updated, and package.json's "files" array was not.
      # It kept listing coop.py, so npm shipped leghorn.py with no data layer
      # at all -- installable, and dead on first run. Nothing caught it,
      # because a missing *file* in a tarball is not a failed publish.
      - name: The npm tarball carries the data layer
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/pack.json"))
          # npm has emitted two shapes for this: a list of package objects, and
          # a dict keyed by package name. Accept either rather than pinning the
          # check to whatever npm the runner happens to ship.
          entry = (d[0] if isinstance(d, list) else next(iter(d.values())))
          files = {f["path"] for f in entry["files"]}
          missing = {"leghorn.py", "henhouse.py", "bin/leghorn.js"} - files
          if missing:
              sys.exit("::error::npm tarball is missing %s -- see package.json files[]"
                       % ", ".join(sorted(missing)))
          print("npm tarball carries:", ", ".join(sorted(files)))
          PY

  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off .
