name: ci

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    # leghorn claims 3.9+ on macOS, Linux, and Windows. curses is stdlib on
    # the first two; Windows gets it from the windows-curses wheel (declared
    # in pyproject.toml, platform-gated), which is why this job installs it
    # explicitly below rather than relying on the package install step alone.
    #
    # This is deliberately not a full os x python cross product. The
    # interpreter is tested on Linux, where a leg costs seconds: 3.9 is the
    # floor, 3.13 is what the Homebrew formula pins, and 3.14 is what the
    # primary dev box actually runs (every local test run used it while CI
    # never did, until it was added). The other two platforms are here to
    # prove the platform claim, not to re-test the interpreter three times:
    #
    # - macOS gets one leg, on 3.13, because that is the python@3.13 the
    #   formula installs -- the interpreter nearly every Mac user runs this
    #   under. There is no Intel leg: this is pure-Python stdlib code with no
    #   compiled dependency on macOS, so arm64 vs x86_64 cannot change a
    #   result. (macos-15-intel used to be here, and macos-13 before GitHub
    #   retired that image in Dec 2025. Six macOS legs per PR were re-running
    #   the same stdlib on the scarcest runners GitHub has.)
    # - Windows gets the floor and the ceiling, because curses there is a
    #   per-interpreter binary wheel, so each Python is a genuinely different
    #   artifact. The ceiling is 3.13, not 3.14: windows-curses wheels top out
    #   at 3.13 (see pyproject.toml), so a 3.14 leg would fail on dependency
    #   resolution rather than on anything in this repo -- a red X that
    #   teaches nothing. Raise it once upstream ships a 3.14 wheel.
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest]
        python: ["3.9", "3.13", "3.14"]
        include:
          - os: macos-latest
            python: "3.13"
          - os: windows-latest
            python: "3.9"
          - os: windows-latest
            python: "3.13"
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python }}
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Install windows-curses
        if: runner.os == 'Windows'
        run: pip install windows-curses
      - name: Run tests
        run: python -m unittest discover -s tests -v
      - name: Smoke test the CLIs
        # Everything here must work on a box with no Claude Code, no sessions
        # and no gh auth -- degradation is the contract under test. henhouse
        # renders its table headless; leghorn itself is curses and can only be
        # asked for --version and --help without a tty.
        run: |
          python leghorn.py --version
          python leghorn.py --help
          python henhouse.py --json | python -c "import json,sys; d=json.load(sys.stdin); assert d.get('schema')=='henhouse.session.v1' and isinstance(d.get('rows'), list), d"
          python henhouse.py --json --legacy-json | python -c "import json,sys; assert isinstance(json.load(sys.stdin), list)"
          python henhouse.py --github || true
          python henhouse.py --github --json | python -c "import json,sys; d=json.load(sys.stdin); assert set(d) == {'events','warn'}, d"

  packaging:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: pyproject.toml
      - name: Version consistency across artifacts
        run: packaging/check-version-consistency.sh
      - name: The .deb builds and carries the same version
        run: |
          set -euo pipefail
          packaging/build-deb.sh
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' leghorn.py)
          test -f "dist/leghorn_${version}_all.deb"
          rm -rf /tmp/debx && mkdir -p /tmp/debx
          dpkg-deb -x "dist/leghorn_${version}_all.deb" /tmp/debx
          got=$(gunzip -c /tmp/debx/usr/share/man/man1/leghorn.1.gz | head -1)
          case "$got" in
            *"\"leghorn ${version}\""*) ;;
            *) echo "::error::man page in the .deb says: $got (want leghorn ${version})"; exit 1 ;;
          esac
          # The /usr/bin entry is a symlink into /usr/lib/leghorn; a broken
          # link here means the sibling-resolution layout regressed.
          test -L /tmp/debx/usr/bin/leghorn
          python3 /tmp/debx/usr/lib/leghorn/leghorn.py --version
          echo "dist/leghorn_${version}_all.deb ok"

      # Every channel must ship henhouse.py beside leghorn.py -- leghorn is
      # only a renderer and cannot start without its data layer. The wheel
      # enforces this via only-include and the .deb via the check above, but
      # npm's file list is hand-maintained and drifted: when coop.py was
      # renamed to henhouse.py the module, the wheel, the deb and the release
      # smoke test were all updated, and package.json's "files" array was not.
      # It kept listing coop.py, so npm shipped leghorn.py with no data layer
      # at all -- installable, and dead on first run. Nothing caught it,
      # because a missing *file* in a tarball is not a failed publish.
      - name: The npm tarball carries the data layer
        run: |
          set -euo pipefail
          npm pack --dry-run --json > /tmp/pack.json
          python3 - <<'PY'
          import json, sys
          d = json.load(open("/tmp/pack.json"))
          # npm has emitted two shapes for this: a list of package objects, and
          # a dict keyed by package name. Accept either rather than pinning the
          # check to whatever npm the runner happens to ship.
          entry = (d[0] if isinstance(d, list) else next(iter(d.values())))
          files = {f["path"] for f in entry["files"]}
          missing = {"leghorn.py", "henhouse.py", "bin/leghorn.js"} - files
          if missing:
              sys.exit("::error::npm tarball is missing %s -- see package.json files[]"
                       % ", ".join(sorted(missing)))
          print("npm tarball carries:", ", ".join(sorted(files)))
          PY

  security:
    runs-on: ubuntu-latest
    container:
      image: semgrep/semgrep
    steps:
      - uses: actions/checkout@v7
      - name: Semgrep
        run: semgrep scan --config p/python --config p/secrets --error --metrics=off .

  codespell:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: codespell-project/actions-codespell@v2
        with:
          path: leghorn.py,henhouse.py,docs,.
          skip: .git,*.pyc,__pycache__,tests/fixtures

  # The branch ruleset requires this one check instead of naming every job
  # above. Required checks match by name, and a matrix leg's name is its
  # parameters, so each time the matrix changed the ruleset kept demanding
  # legs that no longer existed: after #38 swapped macos-13 for macos-15-intel,
  # every PR sat on "test (macos-13, ...) -- Expected, waiting for status"
  # and was mergeable only through admin bypass. This job's name never
  # changes; what it asserts is "every job in ci.yml succeeded".
  #
  # `if: always()` is load-bearing. Without it a failed dependency skips this
  # job, and a skipped required check shows as pending forever rather than
  # failed. The jq line then does the real gating: success only, so a
  # cancelled or skipped job fails the gate instead of slipping through as
  # merely not-a-failure.
  ci-ok:
    if: always()
    needs: [test, packaging, security, codespell]
    runs-on: ubuntu-latest
    steps:
      - name: Every job in ci.yml succeeded
        env:
          NEEDS: ${{ toJSON(needs) }}
        run: |
          echo "$NEEDS"
          echo "$NEEDS" | jq -e 'all(.[]; .result == "success")' > /dev/null
