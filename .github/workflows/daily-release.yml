name: daily-release

# Ship when main has moved since the last tag.
#
# - Merged PR already bumped __version__ (0.4 on main, latest tag v0.3) -> tag
#   v0.4 and dispatch release.yml.
# - New commits on an already-tagged version -> bump patch and ship, but pushing
#   that bump to main needs secrets.RELEASE_PAT with branch-protection bypass.
#   Without it, the job skips and a human (or PR) must bump __version__ first.
#
# Runs on every push to main, daily at 06:00 UTC, and on manual dispatch.
on:
  push:
    branches: [main]
  schedule:
    - cron: "0 6 * * *"
  workflow_dispatch:

permissions:
  contents: write
  actions: write

concurrency:
  group: release-main
  cancel-in-progress: false

jobs:
  release-if-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Skip when main is unchanged since the last tag
        id: gate
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "No v* tags yet; merge a PR with __version__ bumped first." >&2
            exit 1
          fi
          echo "latest_tag=$latest" >> "$GITHUB_OUTPUT"
          tag_version="${latest#v}"
          echo "tag_version=$tag_version" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$latest"..HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since $latest; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changes since $latest:"
            git log --oneline "$latest"..HEAD
          fi

      - name: Decide whether to bump or ship the PR's version
        if: steps.gate.outputs.skip != 'true'
        id: plan
        run: |
          current=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' leghorn.py)
          tag_version="${{ steps.gate.outputs.tag_version }}"
          echo "current=$current" >> "$GITHUB_OUTPUT"
          if [ "$current" = "$tag_version" ]; then
            if [ -z "${{ secrets.RELEASE_PAT }}" ]; then
              echo "action=skip-bump" >> "$GITHUB_OUTPUT"
              echo "Same version ($current) as $tag_version tag, but RELEASE_PAT is not set."
              echo "Bump __version__ in a PR, or add a bypass PAT as secrets.RELEASE_PAT."
            else
              echo "action=bump" >> "$GITHUB_OUTPUT"
              echo "Same version ($current) as $tag_version tag; bumping patch."
            fi
          else
            echo "action=ship" >> "$GITHUB_OUTPUT"
            echo "Version already bumped in tree ($current != $tag_version); shipping as-is."
          fi

      - name: Bump patch version
        if: steps.gate.outputs.skip != 'true' && steps.plan.outputs.action == 'bump'
        run: packaging/bump-patch.sh

      - name: Verify
        if: steps.gate.outputs.skip != 'true' && steps.plan.outputs.action != 'skip-bump'
        run: |
          packaging/check-version-consistency.sh
          python -m unittest discover -s tests

      - name: Commit, tag, and push
        if: steps.gate.outputs.skip != 'true' && steps.plan.outputs.action != 'skip-bump'
        env:
          PUSH_TOKEN: ${{ secrets.RELEASE_PAT || github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' leghorn.py)
          git config user.name "leghorn-release-bot"
          git config user.email "dev@swamplink.com"
          if [ "${{ steps.plan.outputs.action }}" = "bump" ]; then
            git add leghorn.py leghorn.1 package.json packaging/leghorn.rb
            git commit -m "chore: release v${version}"
            git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" HEAD:main
          fi
          git tag -f "v${version}"
          git push "https://x-access-token:${PUSH_TOKEN}@github.com/${GITHUB_REPOSITORY}.git" "v${version}" --force

      - name: Trigger the release pipeline
        if: steps.gate.outputs.skip != 'true' && steps.plan.outputs.action != 'skip-bump'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' leghorn.py)
          gh workflow run release.yml --ref "v${version}"
