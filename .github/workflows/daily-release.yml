name: daily-release

# Cut a patch release every day when main has moved since the last tag.
# Tag push triggers release.yml (PyPI, npm, apt, Homebrew tap, winget).
#
# Skips quietly on days with nothing new to ship. workflow_dispatch always
# evaluates the same gate -- use it to release early without waiting for cron.
on:
  schedule:
    - cron: "0 6 * * *" # 06:00 UTC
  workflow_dispatch:

permissions:
  contents: write

jobs:
  release-if-changed:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v7
        with:
          python-version: "3.13"

      - name: Skip when main is unchanged since the last tag
        id: gate
        run: |
          git fetch --tags --force
          latest=$(git tag -l 'v*' --sort=-v:refname | head -1)
          if [ -z "$latest" ]; then
            echo "No v* tags yet; daily release needs an initial manual tag." >&2
            exit 1
          fi
          echo "latest_tag=$latest" >> "$GITHUB_OUTPUT"
          if git diff --quiet "$latest"..HEAD; then
            echo "skip=true" >> "$GITHUB_OUTPUT"
            echo "Nothing changed since $latest; skipping."
          else
            echo "skip=false" >> "$GITHUB_OUTPUT"
            echo "Changes since $latest:"
            git log --oneline "$latest"..HEAD
          fi

      - name: Bump patch version and verify
        if: steps.gate.outputs.skip != 'true'
        run: |
          packaging/bump-patch.sh
          python -m unittest discover -s tests

      - name: Commit, tag, and push
        if: steps.gate.outputs.skip != 'true'
        run: |
          version=$(sed -n 's/^__version__ = "\(.*\)"/\1/p' leghorn.py)
          git config user.name "leghorn-release-bot"
          git config user.email "dev@swamplink.com"
          git add leghorn.py leghorn.1 package.json packaging/leghorn.rb
          git commit -m "chore: release v${version}"
          git tag "v${version}"
          git push origin HEAD:main
          git push origin "v${version}"
